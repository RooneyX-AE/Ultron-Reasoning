model:
  vocab_size: 65536
  hidden_size: 2048
  num_hidden_layers: 19
  intermediate_size: 6144
  num_attention_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 32768
  rope_theta: 500000
training:
  max_steps: 1000000
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0
  bf16: true
  seed: 42
