model:
  vocab_size: 65536
  hidden_size: 2048
  num_hidden_layers: 19
  intermediate_size: 6144
  num_attention_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 32768
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-6
  use_qk_norm: true
  tie_word_embeddings: true

training:
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 2000
  max_steps: 100000
  grad_clip: 1.0
  grad_accumulation_steps: 8
  sequence_length: 4096
  batch_size: 1
  precision: bf16

reasoning:
  stages:
    - base_pretraining
    - reasoning_midtraining
    - supervised_finetuning
    - rejection_sampling
    - verifier_training
    - rlvr
  max_thinking_tokens: 8192
